name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    env:
      # Placeholders only - nothing in this job opens a connection. They exist because Prisma
      # validates the whole datasource block (including every env() reference) before it will
      # generate, so an unset DIRECT_URL fails with P1012 rather than being ignored.
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Required before typecheck, not just before tests: `Prisma.PrismaClientKnownRequestError`
      # and every model type live in the GENERATED client, and there is no postinstall hook, so
      # `pnpm install` alone leaves @prisma/client as an un-generated stub. Without this the
      # typecheck fails on types that resolve perfectly well on a developer machine, where
      # generate has already run at some point.
      - name: Prisma generate
        run: pnpm --filter @automationdm/database run generate

      # Every workspace package resolves through "main": "dist/index.js" / "types":
      # "dist/index.d.ts", so apps/api's typecheck cannot see @automationdm/zernio, /shared,
      # /validation or /database until they have been compiled. Without this the typecheck fails
      # with a wall of TS2307 "cannot find module" errors plus the implicit-any noise that
      # follows from them - none of which reproduce on a developer machine, where dist/ has been
      # sitting there since the last build. --if-present skips packages/automation-engine, which
      # is an inert placeholder with no build script (ADR 0005).
      - name: Build workspace packages
        run: pnpm --filter "./packages/**" --if-present run build

      - name: ESLint
        run: pnpm run eslint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Prettier format check
        run: pnpm run format:check

  backend-tests:
    runs-on: ubuntu-latest
    # NOTE: unlike the local dev machine (no admin rights, no Docker - see
    # docs/ADR/0003-local-postgresql-strategy.md), GitHub's hosted runners have Docker
    # available, so a plain Postgres service container is the simplest CI-side option -
    # no need to reuse the local embedded-postgres tooling here.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: automationdm
          POSTGRES_PASSWORD: automationdm
          POSTGRES_DB: automationdm
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U automationdm"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://automationdm:automationdm@localhost:5432/automationdm
      # Same value as DATABASE_URL on purpose: schema.prisma declares `directUrl` for Supabase's
      # pooler split, where migrations must bypass the transaction pooler. The service container
      # above has no pooler in front of it, so there is nothing to bypass - but the variable must
      # still be set, or `prisma migrate deploy` fails validation with P1012 before it connects.
      DIRECT_URL: postgresql://automationdm:automationdm@localhost:5432/automationdm
      # A throwaway value that only needs to exist for the lifetime of this CI run (apps/api's
      # tests sign/verify their own internal tokens with it) - not a real secret, same as the
      # fixed Postgres credentials above. Never used outside this job.
      API_INTERNAL_SECRET: ci-only-not-a-real-secret-1c9f3a7b2e4d6f81
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @automationdm/database run generate

      - name: Apply migrations
        run: pnpm --filter @automationdm/database run migrate:deploy

      - name: Database tests
        run: pnpm --filter @automationdm/database run test

      # A glob rather than a hand-listed set: the previous explicit list named database, shared
      # and validation but omitted zernio, so apps/api's tests died on "Failed to resolve entry
      # for package @automationdm/zernio". pnpm runs these in dependency order, and a package
      # added later is picked up automatically instead of silently missing.
      - name: Build workspace packages
        run: pnpm --filter "./packages/**" --if-present run build

      - name: API tests
        run: pnpm --filter @automationdm/api run test
