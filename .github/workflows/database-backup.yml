name: PostgreSQL Daily Backup

on:
  schedule:
    # 06:30 UTC = 12:00 PM IST
    - cron: '30 6 * * *'

  workflow_dispatch:

jobs:
  backup:
    name: Backup Supabase PostgreSQL
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pnpm MUST be installed before setup-node runs: `cache: pnpm` makes setup-node ask pnpm
      # where its store is, which fails outright if pnpm is not on PATH yet. Reversing these
      # two steps breaks the job before it reaches anything interesting.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Ubuntu's default postgresql-client trails Supabase's server version, and pg_dump refuses
      # to dump a NEWER server ("server version mismatch") rather than producing a partial file.
      # Installing from PGDG pins a client that is >= the server. Bump this when Supabase's
      # Postgres major version moves.
      - name: Install PostgreSQL client 17
        run: |
          set -o pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      # Resolve the actual binary rather than trusting PATH.
      #
      # Installing postgresql-client-17 is not enough on its own: `/usr/bin/pg_dump` on
      # Debian/Ubuntu is postgresql-common's `pg_wrapper`, which picks a version of its own
      # accord. The runner image ships client 16 pre-installed, and pg_wrapper kept choosing it
      # even with 17 present - producing "aborting because of server version mismatch, server
      # 17.6, pg_dump 16.14" while the install step had reported success.
      #
      # pg_dump refuses to dump a server NEWER than itself (it cannot know about catalog changes
      # that did not exist when it was built), so this is a hard failure, not a warning.
      #
      # Picking the highest installed version rather than hardcoding /usr/lib/postgresql/17 means
      # this keeps working when Supabase moves to 18: bump the install line above and this
      # follows automatically.
      - name: Resolve PostgreSQL client binary
        run: |
          set -o pipefail

          PG_VERSION=$(ls -1 /usr/lib/postgresql 2>/dev/null | sort -V | tail -1)
          if [ -z "$PG_VERSION" ]; then
            echo "::error::No PostgreSQL client found under /usr/lib/postgresql."
            exit 1
          fi

          PG_DUMP="/usr/lib/postgresql/${PG_VERSION}/bin/pg_dump"
          if [ ! -x "$PG_DUMP" ]; then
            echo "::error::Expected pg_dump at ${PG_DUMP}, but it is not executable."
            exit 1
          fi

          echo "Installed client versions: $(ls -1 /usr/lib/postgresql | sort -V | tr '\n' ' ')"
          echo "PATH pg_dump would have been: $(pg_dump --version)"
          echo "Using instead: $("$PG_DUMP" --version)"

          echo "PG_DUMP=${PG_DUMP}" >> "$GITHUB_ENV"

      - name: Create backup directory
        run: |
          mkdir -p backup

      - name: Create PostgreSQL backup
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          # pipefail is load-bearing, not boilerplate. The dump below is `pg_dump | gzip`, and a
          # pipeline's exit status is the LAST command's - so without this, a pg_dump that fails
          # outright still leaves gzip exiting 0. The result is a small but perfectly valid .gz
          # containing nothing, and the step reports success. That is exactly how a broken backup
          # can go unnoticed until the day it is needed.
          set -o pipefail

          if [ -z "$SUPABASE_DATABASE_URL" ]; then
            echo "::error::SUPABASE_DATABASE_URL secret is not configured."
            exit 1
          fi

          # Two connection strings are wrong here for two entirely different reasons, and both
          # are easy to reach for. Refuse them up front with the actual fix, rather than letting
          # one fail mid-dump with a protocol error and the other with a routing error.

          # 1. The TRANSACTION pooler. pgbouncer in transaction mode multiplexes statements
          #    across connections, so it has no stable session for the operations a dump needs.
          #    This repo's own DATABASE_URL *is* that pooler (docs/DEPLOYMENT.md).
          case "$SUPABASE_DATABASE_URL" in
            *:6543* | *pgbouncer=true*)
              echo "::error::SUPABASE_DATABASE_URL is the transaction pooler (port 6543 / pgbouncer=true). pg_dump cannot run through it. Use the SESSION pooler (port 5432 on *.pooler.supabase.com) from Supabase's Connect dialog."
              exit 1
              ;;
          esac

          # 2. The DIRECT connection (db.<ref>.supabase.co). Correct for pg_dump, and correct
          #    from Vercel or a local machine - but Supabase resolves it to IPv6 only on the
          #    free tier, and GitHub-hosted runners have no IPv6 connectivity. The failure is
          #    "Network is unreachable" before authentication is even attempted, which reads
          #    like a credentials or firewall problem and is neither.
          #
          #    This repo's DIRECT_URL is very likely this host, which makes it the natural thing
          #    to paste into this secret - hence the explicit check.
          case "$SUPABASE_DATABASE_URL" in
            *db.*.supabase.co*)
              echo "::error::SUPABASE_DATABASE_URL is Supabase's DIRECT connection (db.<ref>.supabase.co). That host is IPv6-only on the free tier and GitHub Actions runners have no IPv6, so it is unreachable from here regardless of credentials. Use the SESSION pooler instead: Supabase dashboard > Connect > Session pooler (port 5432, host *.pooler.supabase.com, username postgres.<project-ref>). It is IPv4 and session-mode, so pg_dump works through it."
              exit 1
              ;;
          esac

          TIMESTAMP=$(date -u +"%Y-%m-%d_%H-%M-%S")

          BACKUP_FILE="backup/postgres_${TIMESTAMP}.sql.gz"

          echo "Creating PostgreSQL backup..."
          echo "Backup file: ${BACKUP_FILE}"

          # --schema=public: this project's entire dataset lives there (Prisma owns every table,
          # and authentication is Auth.js against our own `users` table - Supabase Auth is not
          # used). Supabase's managed schemas (auth, storage, realtime, extensions) are not ours
          # to back up: the connecting role cannot read all of them, which produces permission
          # errors mid-dump and a file that fails partway through a restore.
          #
          # schema AND data, deliberately - no --data-only. The dump recreates tables, enums,
          # indexes and constraints as well as rows, so restoring into an empty database gives
          # back a working application rather than rows with nowhere to go. What it does NOT
          # contain is database roles: those are cluster-level and pg_dump never includes them.
          # Nothing here depends on them, because --no-owner/--no-privileges make the restore
          # role-agnostic on purpose.
          # "$PG_DUMP", not bare `pg_dump` - see the "Resolve PostgreSQL client binary" step for
          # why PATH cannot be trusted here.
          "$PG_DUMP" \
            --dbname="$SUPABASE_DATABASE_URL" \
            --schema=public \
            --no-owner \
            --no-privileges \
            --format=plain \
            | gzip > "$BACKUP_FILE"

          # `-s` (non-empty) is too weak on its own: gzip of *nothing* is still about 20 bytes, so
          # an empty dump passes it. Compare the uncompressed size instead, which is 0 for a dump
          # that produced no output at all.
          UNCOMPRESSED=$(gzip -l "$BACKUP_FILE" | awk 'NR==2 {print $2}')
          echo "Uncompressed size: ${UNCOMPRESSED} bytes"

          if [ -z "$UNCOMPRESSED" ] || [ "$UNCOMPRESSED" -lt 1024 ]; then
            echo "::error::Dump is ${UNCOMPRESSED} bytes uncompressed - pg_dump produced essentially nothing. Check this step's output above for the real pg_dump error."
            exit 1
          fi

          echo "BACKUP_FILE=${BACKUP_FILE}" >> "$GITHUB_ENV"

          echo "Backup created successfully."
          ls -lh "$BACKUP_FILE"

      - name: Verify backup
        run: |
          echo "Validating gzip integrity..."
          gzip -t "$BACKUP_FILE"

          # Integrity alone only proves the file is not corrupt - a valid gzip of an empty or
          # schema-less dump passes it. These checks prove the thing that actually matters: that
          # this file is a restore point. A dump missing its CREATE TABLE statements would
          # restore into a database with no tables and lose everything silently.
          echo "Checking the dump is a full restore point (schema + data)..."

          # Matched without the schema qualifier. pg_dump's exact emission varies - it qualifies
          # as `CREATE TABLE public.users`, but with `--schema=public` some versions set
          # search_path and emit a bare `CREATE TABLE users`, and identifiers are quoted when the
          # server deems it necessary. Anchoring on the table name alone accepts every one of
          # those spellings while still failing on a dump that genuinely has no tables, which is
          # the case worth catching.
          MISSING=""
          for table in users organizations organization_members instagram_accounts automations; do
            if ! zgrep -Eq "CREATE TABLE [^;]*\"?${table}\"?" "$BACKUP_FILE"; then
              MISSING="${MISSING} ${table}"
            fi
          done

          if [ -n "$MISSING" ]; then
            echo "::error::Dump is missing CREATE TABLE for:${MISSING}. This is not a restorable backup."
            echo ""
            echo "--- What the dump actually contains (first 60 lines) ---"
            zcat "$BACKUP_FILE" | head -60
            echo ""
            echo "--- Every CREATE statement found ---"
            zgrep -E "^CREATE " "$BACKUP_FILE" | head -40 || echo "(none - the dump has no DDL at all)"
            echo ""
            echo "If the section above is empty or only SET/SELECT lines, pg_dump failed and the"
            echo "real error is in the 'Create PostgreSQL backup' step's log, not here."
            exit 1
          fi

          # The enums are the other half of the schema Prisma depends on - a restore without them
          # fails on the first typed column. Unqualified for the same reason as above.
          if ! zgrep -Eq "^CREATE TYPE " "$BACKUP_FILE"; then
            echo "::error::Dump contains no CREATE TYPE statements - the enums are missing."
            exit 1
          fi

          echo "Backup validation successful - schema and data present."
          ls -lh "$BACKUP_FILE"

      # Uploads, then removes backups older than the retention window - in that order, and only
      # if the upload succeeded, so a failed backup run can never delete an older good one.
      - name: Upload backup to Google Drive and apply retention
        env:
          BACKUP_FILE: ${{ env.BACKUP_FILE }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          # Three months. Set to 0 to keep every backup forever. The script additionally always
          # keeps the 7 newest regardless of age, so a workflow that has been broken for months
          # cannot come back and delete its own history in one pass.
          BACKUP_RETENTION_DAYS: '90'
        run: |
          node scripts/upload-backup-to-drive.mjs

      - name: Cleanup
        if: always()
        run: |
          rm -rf backup

          echo "Temporary backup files removed."
